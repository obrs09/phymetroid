<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metroidvania Phaser Prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #0a0a12;
        overflow: hidden;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a12;
      }
      #game-container:fullscreen,
      #game-container:-webkit-full-screen {
        width: 100%;
        height: 100%;
        background: #0a0a12;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
    <!-- UMD build exposes window.Phaser (ESM build has no default export) -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  </head>
  <body>
    <script>
      function showBootError(msg) {
        var el = document.getElementById('boot-error');
        if (!el) {
          el = document.createElement('pre');
          el.id = 'boot-error';
          el.style.cssText = 'position:fixed;left:8px;top:8px;right:8px;z-index:9999;color:#ff8a80;background:#000c;padding:8px;font:12px/1.4 monospace;white-space:pre-wrap;';
          document.body.appendChild(el);
        }
        el.textContent += String(msg) + '\n';
      }
      window.addEventListener('error', function (e) { showBootError(e.message || e); });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showBootError(r && (r.stack || r.message || r));
      });
    </script>
    <div id="game-container"></div>
    <script type="module" src="./src/main.js?v=layout5"></script>
  </body>
</html>
